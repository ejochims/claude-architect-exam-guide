<title>CCA Foundations Study Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: a calm reading column for lessons, a two-tier dashboard for the path; ivory paper, clay accent, one domain color per exam domain. */
:root {
  --bg: #FAF9F5; --surface: #FFFFFF; --sunk: #F1EEE6; --fg: #1A1916; --muted: #5F5C55; --faint: #8C887E; --line: #E4DFD3;
  --accent: #C6613F; --accent-ink: #A44E2F; --accent-soft: #F5E4DA; --on-accent: #FFFFFF;
  --good: #3F7A3A; --good-soft: #B7CDA8; --good-bg: #E8F0E1; --bad: #B23B2E; --bad-bg: #F7E1DC;
  --d1: #C6613F; --d2: #5F8448; --d3: #3F76AC; --d4: #7D63AE; --d5: #A87B2E;
  --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --shadow: 0 1px 2px rgba(40, 30, 20, .05), 0 4px 16px rgba(40, 30, 20, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1D1B; --surface: #282724; --sunk: #191816; --fg: #EEEAE0; --muted: #ABA79C; --faint: #7F7B72; --line: #3A3834;
    --accent: #E07B58; --accent-ink: #EE9475; --accent-soft: #3B2A22; --on-accent: #1E1D1B;
    --good: #93BF78; --good-soft: #42583A; --good-bg: #24301F; --bad: #EC7F72; --bad-bg: #3D2420;
    --d1: #E07B58; --d2: #93B47A; --d3: #79A7D6; --d4: #A893D6; --d5: #D2A659;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1D1B; --surface: #282724; --sunk: #191816; --fg: #EEEAE0; --muted: #ABA79C; --faint: #7F7B72; --line: #3A3834;
  --accent: #E07B58; --accent-ink: #EE9475; --accent-soft: #3B2A22; --on-accent: #1E1D1B;
  --good: #93BF78; --good-soft: #42583A; --good-bg: #24301F; --bad: #EC7F72; --bad-bg: #3D2420;
  --d1: #E07B58; --d2: #93B47A; --d3: #79A7D6; --d4: #A893D6; --d5: #D2A659;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent-ink); }
code, .mono { font-family: var(--mono); font-size: .86em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--sans); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.read { max-width: 760px; }
.eyebrow { font: 600 11.5px/1.2 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.small { font-size: 13.5px; color: var(--muted); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 20px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); font-weight: 650; letter-spacing: -.01em; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--fg); display: grid; place-items: center; }
.brand-mark svg { width: 16px; height: 16px; }
.brand small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: 0; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-weight: 550; }
.nav a.on { color: var(--fg); background: var(--sunk); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.sync.synced i { background: var(--good); }
.sync.saving i { background: var(--accent); }
@media (max-width: 560px) { .brand small, .sync span { display: none; } .top-in { gap: 8px; } .nav { gap: 0; } .nav a { padding: 6px 7px; font-size: 14px; } }
@media (max-width: 440px) { .brand > span:last-child { display: none; } }

main { padding-block: 32px 96px; }
.foot { border-top: 1px solid var(--line); padding-block: 22px 40px; color: var(--muted); font-size: 13px; }

/* Buttons */
.btn { font: 600 14.5px/1 var(--sans); background: var(--fg); color: var(--bg); border: 0; border-radius: 9px; padding: 11px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn:hover { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1px var(--fg); background: transparent; color: var(--fg); }
.btn.accent { background: var(--accent); color: var(--on-accent); }
.btn.accent:hover { background: var(--accent-ink); }
.btn:disabled { opacity: .4; cursor: default; }
.small-btn { padding: 8px 12px; font-size: 13.5px; margin-left: 10px; }
.chip { display: inline-block; font: 600 11px/1 var(--mono); padding: 4px 6px; border-radius: 5px; background: var(--sunk); color: var(--muted); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.dom-d1 { color: var(--d1); background: color-mix(in srgb, var(--d1) 13%, transparent); }
.dom-d2 { color: var(--d2); background: color-mix(in srgb, var(--d2) 13%, transparent); }
.dom-d3 { color: var(--d3); background: color-mix(in srgb, var(--d3) 13%, transparent); }
.dom-d4 { color: var(--d4); background: color-mix(in srgb, var(--d4) 13%, transparent); }
.dom-d5 { color: var(--d5); background: color-mix(in srgb, var(--d5) 13%, transparent); }
.dom-bg-d1 { background: var(--d1); } .dom-bg-d2 { background: var(--d2); } .dom-bg-d3 { background: var(--d3); } .dom-bg-d4 { background: var(--d4); } .dom-bg-d5 { background: var(--d5); }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: end; margin-bottom: 34px; }
.hero h1 { font: 600 clamp(34px, 5.4vw, 54px)/1.02 var(--sans); letter-spacing: -.03em; margin: 10px 0 14px; }
.hero h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent-ink); letter-spacing: -.01em; }
.hero p { font: 400 19px/1.5 var(--serif); color: var(--muted); max-width: 54ch; margin: 0; }
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; box-shadow: var(--shadow); }
.ring { width: 96px; height: 96px; }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: var(--sunk); }
.ring .val { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .6s ease; }
.ring text { font: 700 22px var(--sans); fill: var(--fg); }
.goal-k { font-size: 13px; color: var(--muted); }
.goal-v { font: 650 22px/1.2 var(--sans); font-variant-numeric: tabular-nums; }
.goal-v + .goal-k { margin-bottom: 8px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }

.cont { display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--fg); color: var(--bg); border-radius: 14px; padding: 20px 22px; margin-bottom: 40px; }
.cont .eyebrow { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.cont h2 { font-size: 21px; margin-top: 6px; }
.cont p { margin: 4px 0 0; color: color-mix(in srgb, var(--bg) 75%, transparent); font-family: var(--serif); font-size: 16px; }
.cont .btn { background: var(--accent); color: var(--on-accent); }
.cont .btn:hover { background: var(--bg); color: var(--fg); }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
.sec-head h2 { font-size: 20px; }
.domains { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 44px; }
.dom { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.dom-top { display: flex; justify-content: space-between; align-items: baseline; }
.dom-n { font: 600 12px var(--mono); }
.dom-w { font: 600 12px var(--mono); color: var(--muted); }
.dom-name { font-weight: 600; line-height: 1.25; min-height: 2.5em; }
.bar { height: 6px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 4px; transition: width .5s ease; }
.dom-meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 900px) { .domains { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .domains { grid-template-columns: 1fr; } .dom-name { min-height: 0; } }

.path { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.mod { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
a.mod:hover { background: var(--surface); }
.mod-n { font: 500 26px/1 var(--serif); color: var(--faint); text-align: center; font-variant-numeric: tabular-nums; }
.mod.ready .mod-n { color: var(--accent-ink); }
.mod-title { font-weight: 650; font-size: 16.5px; }
.mod-p { font: 400 15.5px/1.4 var(--serif); color: var(--muted); margin: 2px 0 7px; }
.mod-side { text-align: right; font-size: 12.5px; color: var(--muted); white-space: nowrap; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.status { font: 600 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 5px 7px; border-radius: 5px; }
.status.done { background: var(--good-bg); color: var(--good); }
.status.prog { background: var(--accent-soft); color: var(--accent-ink); }
.status.new { background: var(--sunk); color: var(--fg); }
.status.soon { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line); }
.mod.soon .mod-title, .mod.soon .mod-p { opacity: .62; }
.mini { width: 72px; height: 4px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.mini span { display: block; height: 100%; background: var(--accent); }
@media (max-width: 560px) { .mod { grid-template-columns: 34px minmax(0, 1fr); } .mod-side { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; } .mod-n { font-size: 21px; } }

/* Blueprint */
.bp-dom { margin-bottom: 30px; }
.bp-dom h2 { font-size: 19px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.bp-rows { margin-top: 10px; border-top: 1px solid var(--line); }
.bp-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 120px 60px; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.bp-row .mono { color: var(--muted); }
.bp-row a { color: var(--fg); text-decoration: none; font-size: 12.5px; }
.bp-row a:hover { color: var(--accent-ink); }
.bp-pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
@media (max-width: 560px) { .bp-row { grid-template-columns: 38px minmax(0, 1fr) 48px; } .bp-row .bp-mod { display: none; } }
.oos { columns: 2 260px; color: var(--muted); padding-left: 18px; }

/* Lesson */
.crumb { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); text-decoration: none; font-weight: 550; margin-bottom: 18px; }
.crumb:hover { color: var(--fg); }
.l-head h1 { font: 650 clamp(28px, 4.4vw, 40px)/1.08 var(--sans); letter-spacing: -.025em; margin: 8px 0 10px; }
.l-principle { font: italic 400 20px/1.45 var(--serif); color: var(--accent-ink); margin: 0 0 14px; }
.steps { display: flex; gap: 4px; margin: 26px 0 8px; }
.steps button { flex: 1; height: 6px; border: 0; padding: 0; border-radius: 3px; background: var(--line); cursor: pointer; }
.steps button.done { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.steps button.cur { background: var(--accent); }
.step-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.step h2 { font-size: 26px; letter-spacing: -.02em; margin-bottom: 14px; }
.prose { font: 400 18px/1.62 var(--serif); }
.prose p, .prose ul, .prose ol { margin: 0 0 16px; }
.prose li { margin-bottom: 8px; }
.prose h3 { font-size: 18px; margin: 26px 0 10px; }
.prose h4 { font-size: 15.5px; margin: 0 0 6px; }
.prose strong { font-weight: 600; }
.prose code { background: var(--sunk); padding: 1px 5px; border-radius: 4px; font-size: .78em; }
.lede { font-size: 20.5px; line-height: 1.5; }
.moves { padding-left: 22px; }
.moves li::marker { font-family: var(--sans); font-weight: 700; color: var(--accent-ink); }
.callout { border-radius: var(--r); padding: 16px 18px; margin: 22px 0; background: var(--sunk); font-size: 16.5px; }
.callout p { margin: 0; }
.callout-label { font: 650 12px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 8px; color: var(--muted); }
.callout.key { background: var(--accent-soft); }
.callout.key .callout-label { color: var(--accent-ink); }
.callout.today { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.callout.today .callout-label::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--d3); margin-right: 7px; vertical-align: 1px; }
.code { font: 400 13.2px/1.6 var(--mono); background: var(--sunk); border-radius: var(--r); padding: 14px 16px; overflow-x: auto; margin: 0 0 16px; color: var(--fg); }
.code code { background: none; padding: 0; font-size: 1em; }
.code .k { color: var(--d4); } .code .s { color: var(--d2); } .code .c { color: var(--faint); font-style: italic; }
.table-wrap { overflow-x: auto; margin: 0 0 18px; }
table { border-collapse: collapse; width: 100%; font: 400 14.5px/1.45 var(--sans); }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.anti, .mech { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 6px 0 20px; font-size: 15.5px; line-height: 1.5; }
.anti > div, .mech > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.anti > div { border-top: 3px solid var(--bad); }
.anti p, .mech p { margin: 0; }
.mech .tag { font: 600 10.5px/1 var(--mono); text-transform: uppercase; color: var(--accent-ink); letter-spacing: .08em; }
.mech h4 { margin: 6px 0; }
@media (max-width: 680px) { .anti, .mech { grid-template-columns: 1fr; } }

.widget-intro { font: 400 18px/1.55 var(--serif); margin: 0 0 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
.panel h3 { font-size: 17px; margin: 26px 0 12px; }

/* Diagram */
.diagram { margin: 4px 0 20px; overflow-x: auto; }
.diagram svg { width: 100%; min-width: 520px; height: auto; display: block; }
.svg-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.svg-accent { fill: var(--accent); }
.svg-line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
.svg-dash { stroke: var(--faint); stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
.svg-ink { fill: var(--fg); }
.svg-label { font: 600 10.5px var(--sans); letter-spacing: .08em; fill: var(--muted); }
.svg-text { font: 500 14px var(--sans); fill: var(--fg); }
.svg-mono { font: 500 13px var(--mono); fill: var(--fg); }
.svg-text-strong { font: 700 17px var(--sans); fill: var(--on-accent); }
.svg-small { font: 400 12px var(--sans); fill: var(--muted); }
.svg-accent + text + text { fill: var(--on-accent); opacity: .85; }

/* Exam blueprint embeds */
.scen-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0 0 20px; font-family: var(--sans); }
.scen { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.scen-n { font: 500 22px/1 var(--serif); color: var(--accent-ink); width: 18px; }
.scen-name { font-weight: 600; font-size: 15px; line-height: 1.3; margin-bottom: 6px; }
@media (max-width: 560px) { .scen-grid { grid-template-columns: 1fr; } }
.weights { display: flex; flex-direction: column; gap: 9px; margin: 0 0 20px; font-family: var(--sans); font-size: 14px; }
.weight-row { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr) 40px; gap: 12px; align-items: center; }
.weight-track { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; }
.weight-fill { display: block; height: 100%; border-radius: 5px; }
.weight-val { font: 600 13px var(--mono); text-align: right; }
@media (max-width: 520px) { .weight-row { grid-template-columns: minmax(0, 1fr) 40px; } .weight-track { grid-column: 1 / -1; grid-row: 2; } }

/* Options (shared by quizzes and widgets) */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { font: 500 15px/1.4 var(--sans); text-align: left; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--fg); }
.opt:disabled { cursor: default; }
.opt.is-right { border-color: var(--good); background: var(--good-bg); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt .letter { font: 600 12px/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; flex: none; margin-top: 1px; }
.opt .opt-body { min-width: 0; }
.opt .opt-why { display: block; font: 400 15px/1.5 var(--serif); color: var(--muted); margin-top: 6px; }
.opt.is-right .opt-why, .opt.is-wrong .opt-why { color: var(--fg); }
.trap-badge { display: inline-block; font: 600 10.5px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--bad); border: 1px solid currentColor; border-radius: 4px; padding: 3px 5px; margin-top: 7px; }

/* Quiz */
.qs { display: flex; flex-direction: column; gap: 22px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.q-meta { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.q-stem { font: 400 18px/1.5 var(--serif); margin: 0 0 14px; }
.q-stem code { background: var(--sunk); padding: 1px 4px; border-radius: 4px; font-size: .8em; }
.q-res { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; font-weight: 600; }
.q-res.ok { color: var(--good); } .q-res.no { color: var(--bad); }
.linkbtn { background: none; border: 0; color: var(--muted); font: 500 13.5px var(--sans); text-decoration: underline; cursor: pointer; padding: 4px; }

/* Recap */
.recap { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; counter-reset: r; }
.recap li { counter-increment: r; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 400 17px/1.45 var(--serif); }
.recap li::before { content: counter(r); font: 600 13px/1.7 var(--mono); color: var(--accent-ink); }

.l-nav { position: sticky; bottom: 0; display: flex; justify-content: space-between; gap: 10px; padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); margin-top: 30px; background: linear-gradient(to top, var(--bg) 70%, transparent); }

/* Trap spotter */
.trap-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.trap { text-align: left; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; font: 400 13.5px/1.4 var(--sans); min-width: 0; }
.trap:hover { border-color: var(--fg); }
.trap-id { font: 600 11px var(--mono); color: var(--bad); }
.trap-name { font-weight: 650; font-size: 14.5px; }
.trap-tell { color: var(--muted); }
.trap-why { display: none; border-top: 1px dashed var(--line); padding-top: 8px; font-family: var(--serif); font-size: 15px; }
.trap.open { border-color: var(--bad); }
.trap.open .trap-why { display: block; }
@media (max-width: 860px) { .trap-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.spot { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
.spot-text { font: italic 400 19px/1.5 var(--serif); margin: 10px 0 14px; }
.spot-feedback { margin-top: 12px; font: 400 16px/1.5 var(--serif); }
.spot-done, .loop-done { text-align: left; }
.big-num { font: 650 34px/1.1 var(--sans); letter-spacing: -.02em; margin-bottom: 8px; font-variant-numeric: tabular-nums; }

/* Loop stepper */
.loop-meter { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 12px; align-items: center; margin-bottom: 14px; }
.loop-count { font: 600 13px var(--mono); color: var(--muted); }
.loop-bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.loop-bar span { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
.loop-cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 680px) { .loop-cols { grid-template-columns: 1fr; } }
.loop-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-head { font: 600 11.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.msg { border-radius: 10px; padding: 10px; border: 1px solid var(--line); background: var(--bg); }
.msg-assistant { background: color-mix(in srgb, var(--accent) 6%, var(--bg)); }
.msg.fresh { animation: pop .5s ease; box-shadow: 0 0 0 2px var(--accent-soft); }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .msg.fresh { animation: none; } * { transition: none !important; } }
.msg-role { font: 600 11px var(--mono); color: var(--muted); }
.msg-blocks { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.blk { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 13.5px; }
.blk-type { font: 600 10.5px var(--mono); color: var(--accent-ink); }
.blk-tool_result .blk-type { color: var(--d2); }
.blk-text .blk-type { color: var(--muted); }
.blk-body { overflow-wrap: anywhere; }
.blk-body.mono { font-size: 12px; }
.stop { display: flex; gap: 10px; align-items: center; font: 600 12px var(--mono); color: var(--muted); padding: 10px; border: 1px dashed var(--line); border-radius: 10px; }
.stop-val { font-size: 14px; padding: 4px 8px; border-radius: 6px; }
.stop-tool_use { background: var(--accent-soft); color: var(--accent-ink); }
.stop-end_turn { background: var(--good-bg); color: var(--good); }
.loop-q { margin-top: 16px; }
.q-lead { font-weight: 650; margin: 0 0 8px; }
.loop-fb { margin-top: 10px; font: 400 16px/1.5 var(--serif); }

/* Compliance sim */
.sim-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--muted); font: 600 13.5px var(--sans); padding: 8px 12px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.sim-frame { background: var(--bg); border-radius: 10px; padding: 8px; }
.sim-canvas { width: 100%; height: auto; display: block; aspect-ratio: 8 / 5; max-width: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 10px 0; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.dot-ok { background: var(--good-soft); } .dot-bad { background: var(--bad); } .dot-blocked { background: var(--d3); }
.sim-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sim-stats:empty { display: none; }
.sim-stats > div { background: var(--bg); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.stat-n { font: 650 24px/1 var(--sans); color: var(--fg); font-variant-numeric: tabular-nums; }
.stat-n.bad { color: var(--bad); } .stat-n.good { color: var(--good); } .stat-n.blue { color: var(--d3); }
@media (max-width: 560px) { .sim-stats { grid-template-columns: 1fr; } }

/* Hook playground */
.hp-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 22px; align-items: center; margin-bottom: 14px; }
@media (max-width: 600px) { .hp-controls { grid-template-columns: 1fr; } }
.hp-field { display: grid; grid-template-columns: auto minmax(0, 1fr) 70px; gap: 12px; align-items: center; font-weight: 600; }
.hp-field input { accent-color: var(--accent); width: 100%; }
.hp-amt { font: 650 16px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.hp-check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.hp-check input { accent-color: var(--accent); width: 18px; height: 18px; }
.pipeline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 4px 0 12px; }
@media (max-width: 600px) { .pipeline { grid-template-columns: 1fr 1fr; } }
.stage { border-radius: 10px; padding: 10px; border: 1px solid var(--line); background: var(--bg); min-width: 0; position: relative; }
.stage-title { font-weight: 650; font-size: 13.5px; }
.stage-note { font: 400 12px var(--mono); color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.stage.pass { border-color: var(--good); background: var(--good-bg); }
.stage.fail { border-color: var(--bad); background: var(--bad-bg); }
.stage.idle { opacity: .5; }
.hp-result { border-radius: 10px; padding: 12px 14px; font: 400 16px/1.5 var(--serif); }
.hp-result.ok { background: var(--good-bg); } .hp-result.deny { background: var(--bad-bg); }

/* Prompt or code */
.poc { display: flex; flex-direction: column; gap: 8px; }
.poc-btns { flex-wrap: wrap; justify-content: flex-end; }
.poc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.poc-row.stacked { grid-template-columns: 1fr; }
.poc-row.stacked .poc-btns { justify-content: flex-start; }
.poc-text { margin: 0; font: 400 16.5px/1.4 var(--serif); }
.poc-btns { display: flex; gap: 6px; }
.pill-btn { font: 600 13px var(--sans); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
.pill-btn:hover { border-color: var(--fg); }
.pill-btn.is-right { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.pill-btn.is-wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.poc-fb { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.poc-fb:empty { display: none; }
.poc-score { margin-top: 12px; font-weight: 650; }
@media (max-width: 520px) { .poc-row { grid-template-columns: 1fr; } }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; }

/* Shared page header */
.page-head { margin-bottom: 26px; }
.page-head h1 { font: 650 clamp(28px, 4.4vw, 40px)/1.08 var(--sans); letter-spacing: -.025em; margin: 8px 0 10px; }
.page-head p { font: 400 18px/1.5 var(--serif); color: var(--muted); margin: 0; }
.score-of { font-size: .5em; color: var(--muted); font-weight: 500; }
.pass { color: var(--good); } .fail { color: var(--bad); }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

/* Home quick stats */
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: -16px 0 40px; }
.qk { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.qk:hover { border-color: var(--fg); }
.qk-n { font: 650 24px/1.1 var(--sans); font-variant-numeric: tabular-nums; }
.qk-n small { font-size: 14px; color: var(--muted); font-weight: 500; }
.qk-l { font-size: 13px; color: var(--muted); line-height: 1.35; }
@media (max-width: 760px) { .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Practice */
.mock-card { display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 20px 22px; margin-bottom: 30px; box-shadow: var(--shadow); }
.mock-card h2 { font-size: 20px; margin: 6px 0 4px; }
.mock-card p { margin: 0; font: 400 16px/1.45 var(--serif); color: var(--muted); max-width: 60ch; }
.hist { border-top: 1px solid var(--line); }
.hist-row { display: grid; grid-template-columns: 80px 70px minmax(0, 1fr) 52px; gap: 12px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.hist-s { font-weight: 700; text-align: right; }
.hist-s.pass { color: var(--good); } .hist-s.fail { color: var(--bad); }
.drills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.drill { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-decoration: none; color: var(--fg); min-width: 0; }
.drill:hover { border-color: var(--fg); }
.drill-n { font: 500 26px/1 var(--serif); color: var(--accent-ink); }
.drill-name { font-weight: 650; font-size: 15.5px; line-height: 1.3; min-height: 2.6em; }
@media (max-width: 860px) { .drills { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .drills { grid-template-columns: 1fr; } .drill-name { min-height: 0; } }
.drill-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-bottom: 14px; }

/* Mock exam */
.exam-bar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 4; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px; margin-bottom: 18px; }
.timer { font: 650 15px var(--mono); font-variant-numeric: tabular-nums; background: var(--sunk); padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
.timer.low { background: var(--bad-bg); color: var(--bad); }
.opt.is-sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.opt.is-sel .letter { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.exam-nav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin: 18px 0; }
.palette button { font: 600 12.5px var(--mono); height: 34px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; position: relative; }
.palette button.ans { background: var(--sunk); color: var(--fg); }
.palette button.cur { border-color: var(--accent); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent); }
.palette button.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--d5); }
.submit-box { border-top: 1px solid var(--line); padding-top: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.submit-box p { margin: 0; }
.rules { font: 400 16.5px/1.55 var(--serif); padding-left: 20px; margin: 0 0 16px; }

/* Flashcards */
.sel { display: block; width: 100%; max-width: 420px; margin: 6px 0 18px; font: 500 14.5px var(--sans); padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; min-height: 240px; display: flex; flex-direction: column; gap: 16px; cursor: pointer; box-shadow: var(--shadow); }
.flash.flipped { cursor: default; }
.flash-meta { display: flex; justify-content: space-between; gap: 10px; }
.flash-f { font: 500 clamp(20px, 3vw, 24px)/1.35 var(--serif); }
.flash-b { font: 400 18px/1.55 var(--serif); border-top: 1px dashed var(--line); padding-top: 16px; color: var(--fg); }
.flash-hint { margin-top: auto; }
.flash-btns { justify-content: flex-end; }
kbd { font: 600 11px var(--mono); border: 1px solid currentColor; border-radius: 4px; padding: 1px 4px; opacity: .6; margin-left: 4px; }

/* Widgets: tool_choice, context viewer, budget, SLA, CI, segments */
.tc-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.tc-desc { font: 400 16.5px/1.5 var(--serif); margin: 0 0 14px; }
.seg { flex-wrap: wrap; }
.cv-toggles { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.cv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-bottom: 12px; }
.cv-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); min-width: 0; }
.cv-name { font-weight: 650; font-size: 14px; }
.cv-label { font: 600 10.5px var(--mono); color: var(--muted); text-transform: uppercase; margin: 6px 0 4px; }
.cv-ctx { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-direction: column; gap: 4px; }
.cv-ctx li { font: 400 12px/1.4 var(--mono); background: var(--sunk); border-radius: 5px; padding: 4px 6px; overflow-wrap: anywhere; }
.cv-note { font: 400 14px/1.4 var(--serif); color: var(--muted); }
.cb-bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--sunk); margin: 14px 0 8px; }
.cb-bar span { display: block; height: 100%; min-width: 2px; }
.hp-field + .cv-toggles { margin-top: 12px; }
.sla-track { position: relative; display: flex; height: 34px; margin: 22px 0 12px; border-radius: 8px; overflow: visible; background: var(--sunk); }
.sla-seg { display: flex; align-items: center; justify-content: center; font: 600 11.5px var(--sans); white-space: nowrap; overflow: hidden; color: var(--fg); }
.sla-seg.wait { background: color-mix(in srgb, var(--d5) 35%, transparent); border-radius: 8px 0 0 8px; }
.sla-seg.batch { background: color-mix(in srgb, var(--d3) 35%, transparent); }
.sla-seg.post { background: color-mix(in srgb, var(--d4) 35%, transparent); }
.sla-line { position: absolute; top: -18px; bottom: -4px; border-left: 2px dashed var(--fg); }
.sla-line span { position: absolute; top: 0; left: 4px; font: 600 11px var(--mono); white-space: nowrap; transform: translateX(-100%) translateX(-8px); }
.ci-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.ci-list li { font: 400 15px/1.4 var(--serif); padding-left: 24px; position: relative; }
.ci-list li::before { position: absolute; left: 0; font: 700 14px var(--sans); }
.ci-list li.ok::before { content: "\2713"; color: var(--good); }

.seg-body h4 { margin: 18px 0 8px; font-size: 15px; }
.seg-table { display: flex; flex-direction: column; gap: 6px; }
.seg-r { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 56px 80px; gap: 10px; align-items: center; font-size: 14px; }
.seg-v { font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
.seg-v.bad { color: var(--bad); }
.seg-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.seg-body .hp-result { margin-top: 14px; }
@media (max-width: 520px) { .seg-r { grid-template-columns: minmax(0, 1fr) 56px; } .seg-r .bar, .seg-r .small { display: none; } }
